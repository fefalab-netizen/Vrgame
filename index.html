<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOLLOW STONE — The First Vault</title>
  <meta name="description" content="Stay-in-place WebXR horror. Point, click, both hands are flashlights. Open this URL in the Quest browser.">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #050303; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 50% 30%, #2a1008 0%, #070303 55%, #030101 100%);
      color: #e8d2b0;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 24px;
    }
    #boot h1 {
      font-weight: 400; letter-spacing: 0.38em; font-size: clamp(22px, 4vw, 42px);
      margin: 0 0 10px; text-indent: 0.38em;
    }
    #boot .sub { letter-spacing: 0.22em; font-size: 12px; opacity: 0.65; text-transform: uppercase; margin-bottom: 28px; }
    #boot p { max-width: 420px; margin: 0 auto 14px; line-height: 1.55; font-size: 15px; color: #cbb89a; }
    #boot button {
      margin-top: 18px; background: transparent; color: #e8d2b0;
      border: 1px solid #a07848; padding: 12px 28px; letter-spacing: 0.18em;
      font-family: inherit; cursor: pointer; text-transform: uppercase; font-size: 12px;
    }
    #boot button:hover { background: #a07848; color: #1a0c06; }
    #hint {
      position: fixed; left: 16px; bottom: 16px; z-index: 15;
      color: #cbb89a; font-family: Georgia, serif; font-size: 13px;
      opacity: 0.8; pointer-events: none; text-shadow: 0 1px 6px #000;
    }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <div class="sub">Level 01</div>
      <h1>HOLLOW STONE</h1>
      <p>Stay where you stand. Look. Point. Touch nothing you cannot see.</p>
      <p>On Quest, both hands become flashlights. Squeeze a trigger to tighten the beam. Point at the stone and click.</p>
      <button id="enter">Open the vault</button>
    </div>
  </div>
  <div id="hint">Look around · point at glowing cracks · trigger to focus the light</div>

  <a-scene
    id="scene"
    embedded
    vr-mode-ui="enabled: true"
    webxr="optionalFeatures: local-floor,hand-tracking,dom-overlay; referenceSpaceType: local-floor"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    fog="type: linear; color: #090605; near: 0.6; far: 9.5"
    background="color: #060403"
    crypt-world
    visible="false">

    <a-assets timeout="15000">
      <img id="tex-wall" crossorigin="anonymous">
      <img id="tex-floor" crossorigin="anonymous">
      <img id="tex-ceil" crossorigin="anonymous">
      <img id="tex-door" crossorigin="anonymous">
    </a-assets>

    <!-- Dim world light — almost nothing. Flashlights do the seeing. -->
    <a-entity light="type: ambient; color: #1a100c; intensity: 0.07"></a-entity>
    <a-entity light="type: hemisphere; skyColor: #24150e; groundColor: #050303; intensity: 0.08"></a-entity>
    <!-- Distant dying ember so the far wall is not a void -->
    <a-entity position="0 0.15 -3.7" light="type: point; color: #6a2208; intensity: 0.18; distance: 3.5; decay: 2"></a-entity>

    <!-- ROOM: inward-facing stone shell, 7 x 7 x 3.1 -->
    <a-entity id="vault">
      <a-plane class="stone-wall" width="7" height="3.1" position="0 1.55 -3.5" rotation="0 0 0"
        material="shader: standard; src: #tex-wall; roughness: 0.97; metalness: 0.02; color: #9a8a78; repeat: 2 1.1; side: front"></a-plane>
      <a-plane class="stone-wall" width="7" height="3.1" position="0 1.55 3.5" rotation="0 180 0"
        material="shader: standard; src: #tex-wall; roughness: 0.97; metalness: 0.02; color: #8e7f6e; repeat: 2 1.1"></a-plane>
      <a-plane class="stone-wall" width="7" height="3.1" position="-3.5 1.55 0" rotation="0 90 0"
        material="shader: standard; src: #tex-wall; roughness: 0.97; metalness: 0.02; color: #958675; repeat: 2 1.1"></a-plane>
      <a-plane class="stone-wall" width="7" height="3.1" position="3.5 1.55 0" rotation="0 -90 0"
        material="shader: standard; src: #tex-wall; roughness: 0.97; metalness: 0.02; color: #8a7b6b; repeat: 2 1.1"></a-plane>
      <a-plane class="stone-floor" width="7" height="7" position="0 0 0" rotation="-90 0 0"
        material="shader: standard; src: #tex-floor; roughness: 0.98; metalness: 0.0; color: #6e6358; repeat: 3 3"></a-plane>
      <a-plane class="stone-ceil" width="7" height="7" position="0 3.1 0" rotation="90 0 0"
        material="shader: standard; src: #tex-ceil; roughness: 1; metalness: 0; color: #5c5248; repeat: 3 3"></a-plane>
    </a-entity>

    <!-- Architectural bits -->
    <a-box position="-2.4 0.22 -3.28" width="1.6" height="0.44" depth="0.42"
      material="shader: standard; src: #tex-wall; roughness: 0.95; color: #7a6c5e"></a-box>
    <a-box position="2.55 0.18 -3.28" width="1.3" height="0.36" depth="0.38"
      material="shader: standard; src: #tex-wall; roughness: 0.95; color: #6f6256"></a-box>
    <!-- Pillars -->
    <a-box position="-2.6 1.55 -2.4" width="0.38" height="3.1" depth="0.38"
      material="shader: standard; src: #tex-wall; roughness: 0.96; color: #7d7164"></a-box>
    <a-box position="2.6 1.55 -2.4" width="0.38" height="3.1" depth="0.38"
      material="shader: standard; src: #tex-wall; roughness: 0.96; color: #7d7164"></a-box>
    <a-box position="-2.6 1.55 2.4" width="0.38" height="3.1" depth="0.38"
      material="shader: standard; src: #tex-wall; roughness: 0.96; color: #74685c"></a-box>
    <a-box position="2.6 1.55 2.4" width="0.38" height="3.1" depth="0.38"
      material="shader: standard; src: #tex-wall; roughness: 0.96; color: #74685c"></a-box>

    <!-- Sealed iron door (clickable) -->
    <a-entity id="door" class="clickable" position="0 1.35 -3.48" inspect="title: SEALED DOOR; body: Sealed from the other side. Something scraped the frame from within. The iron is still warm.">
      <a-box width="1.15" height="2.15" depth="0.08"
        material="shader: standard; src: #tex-door; roughness: 0.55; metalness: 0.55; color: #4a3d34"></a-box>
      <a-box position="0 0 0.05" width="1.22" height="2.22" depth="0.04"
        material="shader: standard; color: #2a221c; roughness: 0.8; metalness: 0.2"></a-box>
      <a-torus position="0.38 -0.15 0.08" radius="0.07" radius-tubular="0.015" rotation="0 0 0"
        material="shader: standard; color: #3a2e22; metalness: 0.7; roughness: 0.4"></a-torus>
    </a-entity>

    <!-- Loose stone — the first real beat -->
    <a-entity id="loose-stone" class="clickable" position="2.05 1.15 -3.46"
      inspect="title: LOOSE STONE; body: The block shifts. Behind it: a rusted key, and a child’s scratch in the mortar — TWO LIGHTS. ONE LIES."
      reveal-key>
      <a-box width="0.42" height="0.28" depth="0.12"
        material="shader: standard; src: #tex-wall; roughness: 0.9; color: #c4a070; emissive: #4a2a10; emissiveIntensity: 0.22"></a-box>
    </a-entity>

    <!-- Wall carving -->
    <a-entity id="carving" class="clickable" position="-2.15 1.55 -3.47"
      inspect="title: CARVING; body: Two hands. Two lamps. The path only appears when both beams cross the same mark.">
      <a-plane width="0.7" height="0.7"
        material="shader: standard; src: #tex-wall; color: #6a4a32; roughness: 1; emissive: #2a1208; emissiveIntensity: 0.15"></a-plane>
      <a-text value="II" align="center" position="0 0 0.02" width="2.2" color="#e8c48a"></a-text>
    </a-entity>

    <!-- Drain / well cover in the floor — future level hook -->
    <a-entity id="drain" class="clickable" position="0 0.02 1.6" rotation="-90 0 0"
      inspect="title: DRAIN; body: A grate in the floor. Water ticks somewhere below. Not this level.">
      <a-ring radius-inner="0.28" radius-outer="0.42" material="shader: standard; color: #2b241c; metalness: 0.6; roughness: 0.45"></a-ring>
      <a-circle radius="0.28" material="shader: flat; color: #050302"></a-circle>
    </a-entity>

    <!-- Rusted key (hidden until loose stone is clicked) -->
    <a-entity id="key" class="clickable" position="2.05 1.15 -3.28" visible="false"
      inspect="title: RUSTED KEY; body: It fits no lock you can see. Cold. Heavy. Taken.">
      <a-box width="0.14" height="0.03" depth="0.02" material="color: #8a6a30; metalness: 0.7; roughness: 0.4"></a-box>
      <a-torus position="-0.08 0 0" radius="0.035" radius-tubular="0.008" material="color: #8a6a30; metalness: 0.7; roughness: 0.4"></a-torus>
    </a-entity>

    <!-- World inspect slate (in front of player) -->
    <a-entity id="slate" visible="false" position="0 1.55 -1.35">
      <a-plane width="1.35" height="0.58" material="shader: flat; color: #120c08; opacity: 0.88; transparent: true"></a-plane>
      <a-text id="slate-title" value="" align="center" position="0 0.16 0.01" width="1.2" color="#e8c48a" font="kelsonsans"></a-text>
      <a-text id="slate-body" value="" align="center" position="0 -0.04 0.01" width="1.15" wrap-count="38" color="#d7c4a4" font="kelsonsans"></a-text>
    </a-entity>

    <!-- Player rig: stay in place -->
    <a-entity id="rig" position="0 0 0">
      <a-camera id="cam" look-controls="pointerLockEnabled: true" wasd-controls="enabled: false" position="0 1.6 0">
        <a-cursor
          fuse="false"
          raycaster="objects: .clickable; far: 8"
          material="color: #e8c48a; shader: flat"
          geometry="radiusInner: 0.004; radiusOuter: 0.008">
        </a-cursor>
        <!-- Desktop / pre-VR stand-in light. Hidden in immersive VR. -->
        <a-entity id="head-light" desktop-lamp>
          <a-light type="spot" color="#ffd8a8" intensity="1.6" angle="22" penumbra="0.55" distance="14" decay="1.3"></a-light>
        </a-entity>
      </a-camera>

      <!-- LEFT HAND FLASHLIGHT -->
      <a-entity id="leftHand"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 9; showLine: true; lineColor: #c48448; lineOpacity: 0.22"
        hand-flashlight="hand: left; color: #ffd4a0; intensity: 2.35">
      </a-entity>

      <!-- RIGHT HAND FLASHLIGHT -->
      <a-entity id="rightHand"
        laser-controls="hand: right"
        raycaster="objects: .clickable; far: 9; showLine: true; lineColor: #c48448; lineOpacity: 0.22"
        hand-flashlight="hand: right; color: #ffe1b5; intensity: 2.35">
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    /* ------------------------------------------------------------------ */
    /* Procedural stone — no external images required for GitHub Pages     */
    /* ------------------------------------------------------------------ */
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function valueNoise(rng, w, h, cell) {
      const gw = Math.ceil(w / cell) + 2;
      const gh = Math.ceil(h / cell) + 2;
      const g = new Float32Array(gw * gh);
      for (let i = 0; i < g.length; i++) g[i] = rng();
      const out = new Float32Array(w * h);
      const fade = (t) => t * t * (3 - 2 * t);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const fx = x / cell, fy = y / cell;
          const x0 = fx | 0, y0 = fy | 0;
          const tx = fade(fx - x0), ty = fade(fy - y0);
          const i00 = y0 * gw + x0, i10 = i00 + 1, i01 = i00 + gw, i11 = i01 + 1;
          const a = g[i00] + (g[i10] - g[i00]) * tx;
          const b = g[i01] + (g[i11] - g[i01]) * tx;
          out[y * w + x] = a + (b - a) * ty;
        }
      }
      return out;
    }
    function paintStone(w, h, seed, opts) {
      const rng = mulberry32(seed);
      const n1 = valueNoise(rng, w, h, opts.cell1 || 48);
      const n2 = valueNoise(rng, w, h, opts.cell2 || 18);
      const n3 = valueNoise(rng, w, h, opts.cell3 || 7);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      const d = img.data;
      const mortarW = opts.mortar || 0.045;
      const bx = opts.brickX || 140;
      const by = opts.brickY || 78;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          const row = Math.floor(y / by);
          const xOff = (row % 2) * (bx * 0.5);
          const lx = ((x + xOff) % bx) / bx;
          const ly = (y % by) / by;
          const inMortar = lx < mortarW || lx > 1 - mortarW || ly < mortarW * 1.6 || ly > 1 - mortarW * 1.6;
          const grain = n1[i] * 0.55 + n2[i] * 0.3 + n3[i] * 0.15;
          let r, g, b;
          if (inMortar) {
            r = 46 + grain * 22; g = 40 + grain * 16; b = 34 + grain * 12;
          } else {
            r = opts.r0 + grain * opts.rd + (n3[i] - 0.5) * 18;
            g = opts.g0 + grain * opts.gd + (n2[i] - 0.5) * 14;
            b = opts.b0 + grain * opts.bd + (n1[i] - 0.5) * 10;
            if (n3[i] > 0.82) { r += 18; g += 8; }          /* pale fleck */
            if (n2[i] < 0.18) { g += 10; b += 4; }          /* damp moss */
          }
          const o = i * 4;
          d[o] = Math.max(0, Math.min(255, r));
          d[o + 1] = Math.max(0, Math.min(255, g));
          d[o + 2] = Math.max(0, Math.min(255, b));
          d[o + 3] = 255;
        }
      }
      /* hairline cracks */
      ctx.putImageData(img, 0, 0);
      ctx.strokeStyle = 'rgba(20,14,10,0.35)';
      ctx.lineWidth = 1;
      for (let k = 0; k < (opts.cracks || 18); k++) {
        ctx.beginPath();
        let x = rng() * w, y = rng() * h;
        ctx.moveTo(x, y);
        for (let s = 0; s < 12; s++) {
          x += (rng() - 0.45) * 28;
          y += (rng() - 0.3) * 22;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      return c.toDataURL('image/jpeg', 0.82);
    }
    function paintIron(w, h, seed) {
      const rng = mulberry32(seed);
      const n = valueNoise(rng, w, h, 22);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < w * h; i++) {
        const v = n[i];
        const rust = v > 0.62 ? (v - 0.62) * 2 : 0;
        d[i * 4]     = 38 + v * 30 + rust * 90;
        d[i * 4 + 1] = 30 + v * 22 + rust * 28;
        d[i * 4 + 2] = 26 + v * 16;
        d[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      /* rivets */
      ctx.fillStyle = '#2a2218';
      for (let y = 18; y < h; y += 46) {
        for (let x = 18; x < w; x += 46) {
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      return c.toDataURL('image/jpeg', 0.8);
    }
    function buildTextures() {
      document.querySelector('#tex-wall').src = paintStone(1024, 1024, 90210, {
        r0: 92, rd: 70, g0: 80, gd: 55, b0: 68, bd: 40, brickX: 160, brickY: 86, cracks: 22
      });
      document.querySelector('#tex-floor').src = paintStone(1024, 1024, 441, {
        r0: 70, rd: 50, g0: 62, gd: 40, b0: 52, bd: 28, brickX: 110, brickY: 110, mortar: 0.06, cracks: 10
      });
      document.querySelector('#tex-ceil').src = paintStone(512, 512, 77, {
        r0: 58, rd: 36, g0: 50, gd: 28, b0: 44, bd: 20, brickX: 90, brickY: 70, cracks: 8
      });
      document.querySelector('#tex-door').src = paintIron(512, 1024, 13);
    }

    /* ------------------------------------------------------------------ */
    /* Dual-hand flashlights                                               */
    /* ------------------------------------------------------------------ */
    AFRAME.registerComponent('hand-flashlight', {
      schema: {
        hand: { type: 'string' },
        color: { type: 'color', default: '#ffd8a8' },
        intensity: { type: 'number', default: 2.3 }
      },
      init: function () {
        this.base = this.data.intensity;
        this.focused = false;
        this.flicker = 1;

        const light = document.createElement('a-light');
        light.setAttribute('type', 'spot');
        light.setAttribute('color', this.data.color);
        light.setAttribute('intensity', this.base);
        light.setAttribute('angle', 19);
        light.setAttribute('penumbra', 0.55);
        light.setAttribute('distance', 15);
        light.setAttribute('decay', 1.35);
        light.setAttribute('castShadow', false);
        this.el.appendChild(light);
        this.light = light;

        const body = document.createElement('a-cylinder');
        body.setAttribute('radius', 0.022);
        body.setAttribute('height', 0.11);
        body.setAttribute('rotation', '90 0 0');
        body.setAttribute('position', '0 -0.02 -0.05');
        body.setAttribute('material', 'color: #161412; roughness: 0.7; metalness: 0.4');
        this.el.appendChild(body);

        const lens = document.createElement('a-sphere');
        lens.setAttribute('radius', 0.024);
        lens.setAttribute('position', '0 -0.02 -0.11');
        lens.setAttribute('material', 'shader: flat; color: #fff4d2; emissive: #ffcc88; emissiveIntensity: 3');
        this.el.appendChild(lens);
        this.lens = lens;

        const beam = document.createElement('a-cone');
        beam.setAttribute('radius-top', 0.48);
        beam.setAttribute('radius-bottom', 0.018);
        beam.setAttribute('height', 2.0);
        beam.setAttribute('position', '0 -0.02 -1.12');
        beam.setAttribute('rotation', '-90 0 0');
        beam.setAttribute('material', 'shader: flat; color: #ffe0b0; opacity: 0.065; transparent: true; side: double; depthWrite: false');
        this.el.appendChild(beam);
        this.beam = beam;

        const on = () => { this.focused = true; };
        const off = () => { this.focused = false; };
        this.el.addEventListener('triggerdown', on);
        this.el.addEventListener('gripdown', on);
        this.el.addEventListener('triggerup', off);
        this.el.addEventListener('gripup', off);
      },
      tick: function (t) {
        if (!this.light) return;
        /* rare stutter — dying batteries */
        if (Math.random() < 0.004) this.flicker = 0.35 + Math.random() * 0.3;
        else this.flicker += (1 - this.flicker) * 0.12;
        const wobble = 1 + Math.sin(t * 0.009 + (this.data.hand === 'left' ? 0 : 1.7)) * 0.025;
        const target = this.focused ? this.base * 1.75 : this.base;
        const ang = this.focused ? 12 : 19;
        this.light.setAttribute('intensity', target * this.flicker * wobble);
        this.light.setAttribute('angle', ang);
        if (this.beam) {
          this.beam.setAttribute('material', 'opacity', this.focused ? 0.1 : 0.06);
        }
      }
    });

    AFRAME.registerComponent('desktop-lamp', {
      init: function () {
        const scene = this.el.sceneEl;
        const hide = () => this.el.setAttribute('visible', false);
        const show = () => this.el.setAttribute('visible', true);
        scene.addEventListener('enter-vr', hide);
        scene.addEventListener('exit-vr', show);
      }
    });

    /* ------------------------------------------------------------------ */
    /* Point-and-click inspect                                             */
    /* ------------------------------------------------------------------ */
    AFRAME.registerComponent('inspect', {
      schema: {
        title: { type: 'string' },
        body: { type: 'string' }
      },
      init: function () {
        this.el.addEventListener('click', () => {
          const slate = document.querySelector('#slate');
          document.querySelector('#slate-title').setAttribute('value', this.data.title);
          document.querySelector('#slate-body').setAttribute('value', this.data.body);
          slate.setAttribute('visible', true);
          clearTimeout(window._slateTimer);
          window._slateTimer = setTimeout(() => slate.setAttribute('visible', false), 6500);
          drip(220, 0.05);
        });
      }
    });

    AFRAME.registerComponent('reveal-key', {
      init: function () {
        this.el.addEventListener('click', () => {
          const key = document.querySelector('#key');
          key.setAttribute('visible', true);
          this.el.setAttribute('position', '2.12 1.08 -3.42');
          this.el.setAttribute('rotation', '8 -12 6');
        });
      }
    });

    AFRAME.registerComponent('crypt-world', {
      init: function () {
        this.el.addEventListener('enter-vr', () => {
          const h = document.getElementById('hint');
          if (h) h.textContent = 'Both hands are lamps. Cross the beams on the carving.';
        });
      }
    });

    /* ------------------------------------------------------------------ */
    /* Tiny horror bed — no audio files                                    */
    /* ------------------------------------------------------------------ */
    let audioCtx;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function drip(freq, gain) {
      const ctx = ensureAudio();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 0.4, ctx.currentTime + 0.18);
      g.gain.setValueAtTime(gain, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.23);
    }
    function startAmbience() {
      const ctx = ensureAudio();
      const buf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.15;
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 280;
      const g = ctx.createGain(); g.gain.value = 0.035;
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      src.start();
      setInterval(() => { if (Math.random() < 0.45) drip(180 + Math.random() * 90, 0.03); }, 2800);
    }

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */
    buildTextures();
    document.getElementById('enter').addEventListener('click', () => {
      document.getElementById('boot').style.display = 'none';
      document.getElementById('scene').setAttribute('visible', true);
      startAmbience();
      const scene = document.getElementById('scene');
      if (scene.hasLoaded) {
        /* ready */
      } else {
        scene.addEventListener('loaded', () => {}, { once: true });
      }
    });
  </script>
</body>
</html>
